name: Tests for sauceDemo

on:
  workflow_dispatch:
    inputs:
      spec:
        description: 'Test file to run'
        type: choice
        default: all
        options:
          - all
          - login
          - sorting
          - cart
          - e2echeckout
          - checkout-missingdetails
      browser:
        description: 'Browser'
        type: choice
        default: all
        options:
          - all
          - chromium
          - firefox
      base_url:
        description: 'Site URL to test'
        type: string
        default: 'https://www.saucedemo.com'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run Playwright tests
        env:
          SPEC: ${{ inputs.spec }}
          BROWSER: ${{ inputs.browser }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          ARGS=""
          if [ -n "$SPEC" ] && [ "$SPEC" != "all" ]; then
            ARGS="tests/$SPEC.spec.ts"
          fi
          if [ -n "$BROWSER" ] && [ "$BROWSER" != "all" ]; then
            ARGS="$ARGS --project=$BROWSER"
          fi
          echo "Running: npx playwright test $ARGS"
          npx playwright test $ARGS
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30